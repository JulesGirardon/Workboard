services:
  app:
    build:
      context: ../..
      dockerfile: ./docker/dev/Dockerfile
    container_name: workboard-dev-app
    volumes:
      - ../../src:/usr/src/app/src
      - ../../public:/usr/src/app/public
      - ../../package.json:/usr/src/app/package.json
      - ../../package-lock.json:/usr/src/app/package-lock.json
    environment:
      - NODE_ENV=development
    env_file:
      - ../../.env
    ports:
      - '3000:3000'
    depends_on:
      - mongo
    command: npm run dev

  mongo:
    image: mongo:6
    container_name: workboard-dev-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data-dev:/data/db

volumes:
  mongo-data-dev:
